version: "3.9"

services:
  postgres:
    image: postgres:15
    container_name: coderadar-db
    environment:
      POSTGRES_USER: coderadar
      POSTGRES_PASSWORD: coderadar
      POSTGRES_DB: coderadar
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: coderadar-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    container_name: coderadar-api
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_started
    ports:
      - "8000:8000"
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    container_name: coderadar-worker
    command: ["celery", "-A", "app.core.celery_app", "worker", "--loglevel=info"]
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_started
    restart: unless-stopped

volumes:
  pgdata:
